<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ruNit vertical story trailer</title>
<!-- Deterministic 1080x1920 compositor: window.render(t). window.TL (timeline.json) is injected by render.mjs. -->
<style>
  @font-face { font-family: "Archivo"; src: url("../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Doto"; src: url("../../node_modules/@fontsource-variable/doto/files/doto-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  :root { --amber: #FFB238; --chalk: #EDEBE4; --ink2: #A9B3BC; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #090C10; font-family: Archivo, sans-serif; color: var(--chalk); }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; display: none; }
  .h1 { font-weight: 800; font-stretch: 66%; font-size: 136px; line-height: .92; letter-spacing: -.012em; white-space: nowrap; }
  .h2 { font-weight: 500; font-stretch: 85%; font-size: 50px; line-height: 1.15; color: var(--ink2); white-space: nowrap; }
  .dot { font-family: Doto, monospace; font-weight: 900; }
  .glow { text-shadow: 0 0 34px rgba(255,178,56,.55); }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-right: .22em; }
  .w > span { display: inline-block; }
  .phone { position: absolute; border-radius: 66px; padding: 15px; box-sizing: border-box;
    background: linear-gradient(145deg, #4a5059, #15181c 38%, #23272d 70%, #3b4048);
    box-shadow: 0 60px 120px -40px rgba(0,0,0,.9), inset 0 0 0 1.5px rgba(255,255,255,.12);
    -webkit-box-reflect: below 26px linear-gradient(transparent 78%, rgba(255,255,255,.14)); }
  .phone .scr { position: relative; width: 100%; height: 100%; overflow: hidden; background: #14181D; }
  .phone .scr img { position: absolute; left: 0; width: 100%; display: block; }
  .phone .island { position: absolute; left: 50%; border-radius: 20px; background: #000; z-index: 3; }
  .phone .sheen { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 70%, rgba(255,255,255,.06) 100%); }
  .persp { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 55%; }
  #cap { position: absolute; left: 60px; right: 60px; top: 600px; text-align: center; font-size: 44px; font-weight: 600; font-stretch: 90%; line-height: 1.3; }
  #cap span { background: rgba(9,12,16,.82); padding: 6px 18px; border-radius: 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const TL = window.TL;
const stage = document.getElementById("stage");
const S = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const BEAT = TL.beat, BAR = TL.bar;
const BUZZ = [0.3, 0.55], DRIBBLES = [2.9, 3.3, 3.7, 4.0], LAMPS = [1.6, 1.9, 2.2];
const CONTACT = S.play.start + 9 * BEAT;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const oc = (x) => 1 - Math.pow(1 - x, 3);
const oe = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const io = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; (parent || stage).appendChild(e); return e; };
const css = (e, o) => Object.assign(e.style, o);
const A = (n) => (["create", "checkin", "teams", "reflect-q", "reflect", "dna", "customize", "skillfx", "opps", "king-paint"].includes(n) ? `assets/${n}.png` : `../broadcast/assets/${n}.png`);
const LOGO = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#FFB238"/><path d="M10 23V9l12 14V9" stroke="#14181D" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const BALL = `<svg viewBox="0 0 100 100" width="100%" height="100%"><defs><radialGradient id="bg" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#FFB27C"/><stop offset=".5" stop-color="#E9692A"/><stop offset="1" stop-color="#7A3210"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="url(#bg)"/><g stroke="#1b1208" stroke-width="2.6" fill="none" opacity=".85"><path d="M2 50h96M50 2v96"/><path d="M18 14c14 14 14 58 0 72M82 14c-14 14-14 58 0 72"/></g></svg>`;

// ---------- world ----------
const lampPools = [180, 540, 900].map((x) => { const d = el("div", "abs"); css(d, { left: x - 520 + "px", top: "-420px", width: "1040px", height: "1100px", borderRadius: "50%", background: "radial-gradient(closest-side, rgba(255,186,90,.28), rgba(255,178,56,.07) 55%, rgba(255,178,56,0))" }); return d; });
const lampHeads = [180, 540, 900].map((x) => { const d = el("div", "abs"); css(d, { left: x - 60 + "px", top: "-12px", width: "120px", height: "24px", borderRadius: "0 0 18px 18px", background: "#FFE2A8", boxShadow: "0 0 60px 20px rgba(255,200,120,.6)" }); return d; });
const floorWrap = el("div", "abs"); css(floorWrap, { left: 0, right: 0, top: "1420px", height: "500px", perspective: "800px", perspectiveOrigin: "50% -60%", overflow: "hidden" });
const floor = el("div", "abs", floorWrap, `<svg viewBox="0 0 2400 1500" width="2400" height="1500" style="position:absolute;inset:0"><g fill="none" stroke="rgba(237,235,228,.5)" stroke-width="7"><path d="M200 60H2200"/><rect x="900" y="60" width="600" height="700" fill="rgba(200,100,31,.5)"/><circle cx="1200" cy="760" r="180"/><path d="M380 60v300a820 820 0 0 0 1640 0V60"/></g></svg>`);
css(floor, { left: "-660px", top: "0", width: "2400px", height: "1500px", transformOrigin: "50% 0", transform: "rotateX(68deg)",
  background: "radial-gradient(900px 600px at 50% 25%, rgba(255,190,110,.32), rgba(0,0,0,0) 70%), repeating-linear-gradient(90deg, #3a2716 0 46px, #33220f 46px 92px, #3d2a18 92px 140px, #2f1f0e 140px 186px)" });
const floorShade = el("div", "abs", floorWrap); css(floorShade, { inset: 0, background: "linear-gradient(180deg, rgba(9,12,16,.8), rgba(9,12,16,.15) 40%, rgba(9,12,16,.6))" });
const ballShadow = el("div", "abs"); css(ballShadow, { borderRadius: "50%", background: "radial-gradient(closest-side, rgba(0,0,0,.65), rgba(0,0,0,0))" });
const ball = el("div", "abs", stage, BALL);

function phone(parent, src, h = 1060) {
  const k = h / 880, p = el("div", "phone", parent);
  css(p, { width: 429 * k + "px", height: h + "px", borderRadius: 66 * k + "px", padding: 15 * k + "px" });
  const scr = el("div", "scr", p); css(scr, { borderRadius: 52 * k + "px" });
  const img = el("img", "", scr); img.src = A(src); css(img, { top: 34 * k + "px" });
  const isl = el("div", "island", scr); css(isl, { width: 118 * k + "px", height: 34 * k + "px", marginLeft: -59 * k + "px", top: 13 * k + "px" });
  const sh = el("div", "sheen", p); css(sh, { borderRadius: 52 * k + "px" });
  const sw = 399 * k;
  return { p, img, sh, h, w: 429 * k, set(n) { const s = A(n); if (!img.src.endsWith(s)) img.src = s; }, scroll(px) { css(img, { transform: `translateY(${-px * sw / 390}px)` }); } };
}
function pose(P, { x = 540, y = 1210, ry = 0, rx = 0, rz = 0, s = 1, o = 1 }) {
  css(P.p, { left: x - P.w / 2 + "px", top: y - P.h / 2 + "px", transform: `rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s})`, opacity: o });
  css(P.sh, { backgroundPosition: `${ry * 4}px 0` });
}
function lines(parent, arr, cls, top, gap) {
  return arr.map((text, i) => {
    const box = el("div", "abs " + cls, parent); css(box, { left: 0, right: 0, textAlign: "center", top: top + i * gap + "px" });
    box.innerHTML = text.split(" ").map((w) => `<span class="w"><span>${w}</span></span>`).join("");
    return { box, spans: [...box.querySelectorAll(".w > span")] };
  });
}
function reveal(L, lt, t0, stagger = 0.05, dur = 0.5, out = Infinity) {
  let n = 0;
  L.forEach((W) => W.spans.forEach((s) => {
    const p = oe(lin(lt, t0 + n * stagger, t0 + n * stagger + dur)), q = io(lin(lt, out, out + 0.25)); n++;
    css(s, { transform: `translateY(${(1 - p) * 105 - q * 105}%)` });
  }));
}
const scenes = [];
function scene(id, from, to, build) { const root = el("div", "layer"); const up = build(root, to - from); scenes.push({ id, from, to, root, up }); }
const inX = (lt) => (1 - oe(lin(lt, 0, 0.5))) * 700;

// hook: a notification, then lights on and a dribble
scene("hook", 0, S.hook.end, (root) => {
  const note = el("div", "abs", root); css(note, { left: "60px", right: "60px", top: "120px", display: "flex", gap: "26px", alignItems: "center", padding: "30px 34px", borderRadius: "40px", background: "rgba(36,41,48,.92)", boxShadow: "0 30px 80px -20px rgba(0,0,0,.8)" });
  note.innerHTML = `${LOGO(96)}<div><div style="font-size:40px;font-weight:700;font-stretch:90%">Northside Commons</div><div style="font-size:38px;color:#C9D0D6;font-stretch:90%">You're up. Your group has the court.</div></div>`;
  const big = lines(root, ["You've got", "next."], "h1 glow", 520, 140); big.forEach((W) => css(W.box, { color: "#FFB238", fontSize: "170px" }));
  return (lt) => {
    const p = oe(lin(lt, BUZZ[0], BUZZ[0] + 0.45)), shake = lt > BUZZ[0] && lt < BUZZ[1] + 0.2 ? Math.sin(lt * 120) * 6 : 0;
    css(note, { transform: `translateY(${(1 - p) * -360}px) translateX(${shake}px)`, opacity: 1 - lin(lt, 3.6, 4.1) });
    reveal(big, lt, 1.05, 0.12, 0.5, S.hook.end - 0.45);
  };
});

function feature(id, o) {
  scene(id, S[id].start, S[id].end, (root, D) => {
    const persp = el("div", "persp", root); const P = phone(persp, o.src);
    const H = lines(root, o.h1, "h1", o.top ?? 210, 128);
    const H2 = o.h2 ? lines(root, [o.h2], "h2", (o.top ?? 210) + o.h1.length * 128 + 24, 60) : [];
    const x = o.extra ? o.extra(root) : null;
    return (lt) => {
      const side = o.flip ? -1 : 1, d = lt / D;
      pose(P, { x: 540 + inX(lt) * side, y: 1290, ry: -10 * side + d * 12 * side, rx: 6, rz: -1 * side, s: 1 + 0.03 * d });
      if (o.swap) P.set(lt >= o.swap[0] * BEAT ? o.swap[1] : o.src);
      if (o.scroll) P.scroll(o.scroll(lt, D));
      reveal(H, lt, 0.2); reveal(H2, lt, 0.5, 0.04);
      if (x) x(lt, D);
    };
  });
}
feature("call", { src: "create", h1: ["Call a run."], h2: "Court. Time. Format. Done.", scroll: (lt, D) => io(lin(lt, 0.8, D - 0.4)) * 420 });
feature("checkin", { src: "checkin", flip: true, h1: ["Scan in."], h2: "Teams pick themselves.", swap: [4, "teams"] });

// play: real scoreboard states on the beat, then two phones meet
scene("play", S.play.start, S.play.end, (root, D) => {
  const persp = el("div", "persp", root); const P = phone(persp, "live-0");
  const P1 = phone(persp, "bump", 900), P2 = phone(persp, "bump", 900);
  const big = el("div", "abs dot", root); css(big, { left: 0, right: 0, top: "180px", textAlign: "center", fontSize: "240px", lineHeight: ".9" });
  const lbl = lines(root, ["Tap the score."], "h2", 420, 60); lbl.forEach((W) => css(W.box, { color: "#EDEBE4" }));
  const ring = el("div", "abs", root); css(ring, { left: "540px", top: "1290px", borderRadius: "50%", border: "10px solid #3DD39B", boxSizing: "border-box" });
  const ok = el("div", "abs", root); css(ok, { left: 0, right: 0, top: "230px", textAlign: "center", zIndex: 5 });
  ok.innerHTML = `<div class="h1" style="font-size:190px;color:#3DD39B;text-shadow:0 0 60px rgba(61,211,155,.5)">Confirmed.</div><div class="h2" style="margin-top:14px;color:#EDEBE4">Both teams signed off.</div>`;
  const STATES = [[13, 12], [15, 12], [15, 14], [17, 14], [17, 16], [19, 16], [19, 18], [21, 18]];
  const c = CONTACT - S.play.start, b8 = 8 * BEAT;
  return (lt) => {
    const k = clamp(Math.floor(lt / BEAT), 0, 7), into = lt - k * BEAT, punch = k > 0 && lt < b8 ? Math.exp(-into * 9) : 0;
    P.set(`live-${k}`);
    const gone = io(lin(lt, b8 - 0.3, b8 + 0.1));
    pose(P, { y: 1290 + gone * 300, ry: -8 + lt * 2, rx: 6, s: (1 + punch * 0.025) * (1 - gone * 0.2), o: 1 - gone });
    const [a, bb] = STATES[k];
    big.innerHTML = `<span style="color:${a >= bb ? "#FFB238" : "#EDEBE4"};text-shadow:0 0 40px rgba(255,178,56,.5)">${a}</span><span style="color:#5d6873">-</span>${bb}`;
    css(big, { opacity: lin(lt, 0.1, 0.4) * (1 - gone), transform: `scale(${1 + punch * 0.05})` });
    reveal(lbl, lt, 0.3, 0.05, 0.5, b8 - 0.4);
    const appear = oe(lin(lt, b8 - 0.1, b8 + 0.4)), meet = io(lin(lt, b8 + 0.2, c)), sep = oc(lin(lt, c + 0.1, c + 1.0));
    const gap = 300 - meet * 120 + sep * 260;
    const op = lt < b8 - 0.1 ? 0 : 1 - lin(lt, c + 0.05, c + 0.45) * 0.85;
    pose(P1, { x: 540 - gap, y: 1300 + (1 - appear) * 500, ry: 24 - meet * 16, rz: -6 + meet * 6, s: 0.86, o: op });
    pose(P2, { x: 540 + gap, y: 1300 + (1 - appear) * 500, ry: -24 + meet * 16, rz: 6 - meet * 6, s: 0.86, o: op });
    const after = lin(lt, c, c + 0.6), rr = oe(after) * 1400;
    css(ring, { width: rr + "px", height: rr + "px", marginLeft: -rr / 2 + "px", marginTop: -rr / 2 + "px", opacity: lt > c ? 1 - after : 0, borderWidth: 14 * (1 - after) + 2 + "px" });
    const okp = oe(lin(lt, c + 0.1, c + 0.5));
    css(ok, { opacity: lt > c ? okp * (1 - lin(lt, D - 0.3, D)) : 0, transform: `scale(${1.25 - 0.25 * okp})` });
  };
});

feature("reflect", { src: "reflect-q", h1: ["How did you", "score today?"], swap: [3, "reflect"] });
feature("dna", { src: "dna", flip: true, h1: ["Your Player DNA."], h2: "Built from your answers, not a rating." });
feature("custom", { src: "customize", h1: ["Build your player."], h2: "Unlock your style as you play.", swap: [4, "skillfx"] });
feature("king", { src: "king-paint", flip: true, h1: ["Take the court."], h2: "Most wins here: Big Bell, 8. For now." });
feature("doors", { src: "opps", h1: ["The run opens doors."], h2: "Tournaments, coaching, reffing, jobs." });

// end card
scene("end", S.end.start, TL.duration + 1, (root) => {
  const mark = el("div", "abs", root); css(mark, { left: 0, right: 0, top: "560px", display: "flex", justifyContent: "center", alignItems: "center", gap: "30px" });
  el("div", "", mark, LOGO(170)); const w = el("div", "h1", mark, "ruNit"); css(w, { fontSize: "230px" });
  const q = el("div", "abs dot glow", root, "Who's got next?"); css(q, { left: 0, right: 0, top: "840px", textAlign: "center", fontSize: "86px", color: "#FFB238" });
  const when = el("div", "abs", root, "Coming first to<br>Hazleton and Scranton, PA"); css(when, { left: 0, right: 0, top: "1010px", textAlign: "center", fontSize: "52px", fontWeight: 600, fontStretch: "85%", lineHeight: 1.25 });
  const foot = el("div", "abs", root, "Prototype. Every player, court, game<br>and score shown is made up.<br><br>Narration: Piper TTS, LibriTTS voice (CC BY 4.0).<br>Music and sound design: original."); css(foot, { left: 0, right: 0, top: "1520px", textAlign: "center", fontSize: "30px", lineHeight: 1.45, color: "#8C99A6" });
  return (lt) => {
    const a = oe(lin(lt, 0, 0.6)); css(mark, { opacity: a, transform: `scale(${1.25 - 0.25 * a})`, filter: `blur(${(1 - a) * 10}px)` });
    css(q, { opacity: lin(lt, 0.7, 1.1) }); css(when, { opacity: lin(lt, 1.3, 1.8) }); css(foot, { opacity: lin(lt, 2.6, 3.2) });
  };
});

// ---------- overlays ----------
const cap = el("div", ""); cap.id = "cap";
const demo = el("div", "abs", stage, "Demo data"); css(demo, { right: "56px", top: "60px", fontSize: "26px", fontWeight: 600, color: "#8C99A6", border: "1px dashed #3A434D", borderRadius: "8px", padding: "3px 12px" });
const streak = el("div", "abs"); css(streak, { top: "-300px", height: "2600px", width: "240px", background: "linear-gradient(90deg, transparent, rgba(255,190,100,.5), transparent)", transform: "rotate(16deg)", mixBlendMode: "screen" });
const flash = el("div", "abs"); css(flash, { inset: 0, background: "#FFF3DE" });
const vignette = el("div", "abs"); css(vignette, { inset: 0, background: "radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.6))" });
const grain = el("canvas", "abs"); grain.width = 270; grain.height = 480; css(grain, { inset: 0, width: "1080px", height: "1920px", opacity: .06, mixBlendMode: "overlay" });
const gctx = grain.getContext("2d"); const gimg = gctx.createImageData(270, 480);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const fade = el("div", "abs"); css(fade, { inset: 0, background: "#000" });
const CUTS = TL.scenes.slice(1).map((s) => s.start);
const CAPS = TL.lines.flatMap((l) => l.captions);

window.render = async (t) => {
  const inHook = t < S.hook.end;
  const lampOn = (i) => { const t0 = LAMPS[i]; if (t < t0) return 0; const f = t - t0; return f < 0.12 ? (Math.floor(f * 50) % 2 ? 0.3 : 1) : 1; };
  const dim = t >= S.end.start ? 0.55 : 1;
  lampPools.forEach((d, i) => css(d, { opacity: (inHook ? lampOn(i) : 1) * dim }));
  lampHeads.forEach((d, i) => css(d, { opacity: (inHook ? lampOn(i) : 1) * dim }));
  css(floorWrap, { opacity: inHook ? Math.max(lampOn(0), lampOn(1), lampOn(2)) : 1 });
  if (t > 2.4 && t < S.call.start) {
    const ground = 1600, size = 140; let y;
    if (t < DRIBBLES[0]) { const p = (t - 2.4) / (DRIBBLES[0] - 2.4); y = ground - 900 * (1 - p * p); }
    else { const k = DRIBBLES.findIndex((b) => b > t); if (k === -1) { const p = (t - DRIBBLES[3]) / 0.4; y = ground - 1400 * p * p; } else { const a = DRIBBLES[k - 1], b = DRIBBLES[k], p = (t - a) / (b - a); y = ground - 4 * 900 * Math.pow(b - a, 2) * p * (1 - p); } }
    const h = Math.max(0, ground - y);
    css(ball, { display: "block", left: 540 - size / 2 + "px", top: y - size + "px", width: size + "px", height: size + "px", transform: `rotate(${t * 220}deg)` });
    css(ballShadow, { display: "block", left: "420px", top: ground - 24 + "px", width: "240px", height: "48px", opacity: clamp(1 - h / 800) * 0.9 });
  } else { css(ball, { display: "none" }); css(ballShadow, { display: "none" }); }
  for (const s of scenes) { const on = t >= s.from && t < s.to; s.root.style.display = on ? "block" : "none"; if (on) s.up(t - s.from); }
  const cut = CUTS.filter((c) => t >= c - 0.2).pop(); const since = cut !== undefined ? t - cut : 9;
  css(streak, { left: -500 + clamp((since + 0.2) / 0.5) * 2000 + "px", opacity: since < 0.4 ? 1 : 0 });
  let fl = since >= 0 && since < 0.25 ? (1 - since / 0.25) * 0.22 : 0;
  if (t >= S.call.start && t < S.call.start + 0.3) fl = (1 - (t - S.call.start) / 0.3) * 0.8;
  if (t >= CONTACT && t < CONTACT + 0.3) fl = Math.max(fl, (1 - (t - CONTACT) / 0.3) * 0.6);
  if (t >= S.end.start && t < S.end.start + 0.35) fl = Math.max(fl, (1 - (t - S.end.start) / 0.35) * 0.7);
  css(flash, { opacity: fl });
  const c = t < S.end.start ? CAPS.find((x) => t >= x.t0 && t < x.t1 + 0.12) : null;
  cap.innerHTML = c ? `<span>${c.text}</span>` : "";
  css(demo, { opacity: t > S.call.start && t < S.end.start ? 1 : 0 });
  seed = Math.floor(t * 60) * 7919 + 13;
  for (let i = 0; i < gimg.data.length; i += 4) { const v = rnd() * 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
  css(fade, { opacity: t < 0.25 ? 1 - t / 0.25 : t > TL.duration - 0.9 ? lin(t, TL.duration - 0.9, TL.duration) : 0 });
  await Promise.all([...document.images].filter((i) => i.src && !i.complete).map((i) => new Promise((r) => { i.onload = r; i.onerror = r; })));
  return true;
};
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {}))));
</script>
</body>
</html>
